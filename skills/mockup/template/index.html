<header class="chrome">
  <div class="brand"><i></i><span>Orbit <small style="font-weight:500;color:var(--muted)">mockups</small></span></div>
  <button class="icon-btn" id="back" type="button" hidden><svg class="ic"><use href="#i-back"/></svg> Mockups</button>
  <span class="chrome-title" id="title" hidden></span>
  <span class="spacer"></span>
  <div class="row chrome-actions">
    <div class="seg" id="device">
      <button type="button" data-device="web" aria-pressed="true"><svg class="ic"><use href="#i-monitor"/></svg> Web</button>
      <button type="button" data-device="mobile" aria-pressed="false"><svg class="ic"><use href="#i-phone"/></svg> Mobile</button>
    </div>
    <button class="icon-btn" id="theme" type="button"><svg class="ic" id="theme-ic"><use href="#i-moon"/></svg> <span id="theme-label">Dark</span></button>
  </div>
</header>

<main id="view"></main>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
